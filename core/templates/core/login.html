<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Clínica Nubnest</title>

  <style>

    :root { --bg:#060d1b; --surface:#0a1628; --s2:#0f1e36; --bmd:rgba(45,212,191,.15); --border:rgba(45,212,191,.08); --accent:#2dd4bf; --a2:#38bdf8; --glow:rgba(45,212,191,.13); --text:#ddeeff; --t2:#6b88a8; --red:#fb7185; --r:12px; --rl:18px; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { min-height: 100vh; background: var(--bg); color: var(--text); font-family: 'Plus Jakarta Sans', sans-serif; font-size: 14px; display: flex; align-items: center; justify-content: center; padding: 20px; background-image: radial-gradient(ellipse at 20% 50%, rgba(45,212,191,.05) 0%, transparent 60%), radial-gradient(ellipse at 80% 20%, rgba(56,189,248,.04) 0%, transparent 60%); }
    .toast { position: fixed; top: 22px; right: 22px; background: rgba(127,29,29,.9); border: 1px solid var(--red); color: #fecaca; padding: 14px 18px; border-radius: var(--rl); font-size: 13.5px; box-shadow: 0 15px 35px rgba(0,0,0,.35); display: none; z-index: 9999; max-width: 360px; line-height: 1.4; backdrop-filter: blur(8px); }
    .login-card { width: 100%; max-width: 420px; background: var(--surface); border: 1px solid var(--bmd); border-radius: var(--rl); padding: 36px 32px; box-shadow: 0 24px 64px rgba(0,0,0,.5); }
    .logo { text-align: center; margin-bottom: 32px; }
    .logo-mark { width: 52px; height: 52px; background: linear-gradient(135deg,var(--accent),var(--a2)); border-radius: 16px; display: flex; align-items: center; justify-content: center; font-size: 22px; color: #040d1a; font-weight: 800; margin: 0 auto 16px; }
    .logo h1 { font-family: 'Playfair Display', serif; color: var(--text); font-size: 26px; margin-bottom: 6px; letter-spacing: -.3px; }
    .logo p { color: var(--t2); font-size: 13.5px; }
    .form-group { display: flex; flex-direction: column; gap: 7px; margin-bottom: 16px; }
    .form-group label { color: var(--t2); font-size: 11px; font-weight: 700; letter-spacing: .6px; text-transform: uppercase; }
    .form-group input { padding: 12px 14px; border-radius: var(--r); border: 1px solid var(--bmd); background: var(--s2); color: var(--text); outline: none; width: 100%; font-family: 'Plus Jakarta Sans', sans-serif; font-size: 14px; transition: border-color .15s, box-shadow .15s; }
    .form-group input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--glow); }
    .btn { width: 100%; padding: 12px 16px; border: none; border-radius: var(--r); cursor: pointer; font-family: 'Plus Jakarta Sans', sans-serif; font-size: 14px; font-weight: 700; background: linear-gradient(135deg,var(--accent),#0891b2); color: #040d1a; margin-top: 8px; transition: all .18s; box-shadow: 0 2px 16px rgba(45,212,191,.25); }
    .btn:hover { filter: brightness(1.08); box-shadow: 0 4px 24px rgba(45,212,191,.35); transform: translateY(-1px); }
    .mensaje { margin-top: 14px; color: var(--red); font-size: 13.5px; text-align: center; min-height: 20px; }
    .hint { margin-top: 20px; color: rgba(107,136,168,.6); font-size: 12px; text-align: center; }

  </style>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>
  <div class="toast" id="toastAcceso">
    No tienes permisos para acceder al sistema administrativo.
  </div>

  <div class="login-card">
    <div class="logo">
      <h1>Clínica Nubnest</h1>
      <p>Acceso al sistema CRM</p>
    </div>

    <div class="form-group">
      <label for="username">Usuario</label>
      <input type="text" id="username" autocomplete="username">
    </div>

    <div class="form-group">
      <label for="password">Contraseña</label>
      <input type="password" id="password" autocomplete="current-password">
    </div>

    <button class="btn" onclick="iniciarSesion()">Iniciar sesión</button>

    <div class="mensaje" id="mensajeLogin"></div>

  </div>

  <script>
    async function iniciarSesion() {
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value.trim();
      const mensaje = document.getElementById('mensajeLogin');

      mensaje.textContent = '';

      if (!username || !password) {
        mensaje.textContent = 'Ingresa usuario y contraseña.';
        return;
      }

      const res = await fetch('/api/login/', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({
          username,
          password
        })
      });

      const data = await res.json();

      if (data.ok) {
        window.location.href = data.redirect;
      } else {
        mensaje.textContent = data.error || 'Credenciales incorrectas.';
      }
    }

    document.addEventListener('keydown', function(e) {
      if (e.key === 'Enter') {
        iniciarSesion();
      }
    });

    const params = new URLSearchParams(window.location.search);

    if (params.get('sin_acceso') === '1') {
      const toast = document.getElementById('toastAcceso');
      toast.style.display = 'block';

      setTimeout(() => {
        toast.style.display = 'none';
        window.history.replaceState({}, document.title, '/login/');
      }, 3500);
    }
  </script>
</body>
</html>
