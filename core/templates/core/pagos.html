<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pagos | Clínica DS</title>

  <style>

    :root {
      --bg:#060d1b; --surface:#0a1628; --s2:#0f1e36; --s3:#152640;
      --border:rgba(45,212,191,.08); --bmd:rgba(45,212,191,.15); --bhi:rgba(45,212,191,.3);
      --accent:#2dd4bf; --a2:#38bdf8; --glow:rgba(45,212,191,.13);
      --text:#ddeeff; --t2:#6b88a8;
      --green:#34d399; --gbg:rgba(52,211,153,.1);
      --red:#fb7185; --rbg:rgba(251,113,133,.1);
      --amber:#fbbf24; --r:12px; --rl:18px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Plus Jakarta Sans', sans-serif; background: var(--bg); color: var(--text); font-size: 14px; line-height: 1.6; }
    .layout { display: flex; min-height: 100vh; }

    /* ── SIDEBAR ── */
    .sidebar { width: 250px; flex-shrink: 0; background: linear-gradient(180deg,#0a1628 0%,#060d1b 100%); border-right: 1px solid var(--bmd); padding: 24px 14px; display: flex; flex-direction: column; }
    .brand { display: flex; align-items: center; gap: 10px; margin-bottom: 32px; padding: 0 6px; }
    .brand-mark { width: 34px; height: 34px; flex-shrink: 0; background: linear-gradient(135deg,var(--accent),var(--a2)); border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 16px; color: #040d1a; font-weight: 800; line-height: 1; }
    .brand-name { font-family: 'Playfair Display', serif; font-size: 17px; font-weight: 700; color: var(--text); letter-spacing: -.2px; }
    .sidebar h1 { font-family: 'Playfair Display', serif; font-size: 18px; color: var(--accent); margin-bottom: 28px; }
    .sidebar a { display: block; text-decoration: none; color: var(--t2); padding: 9px 12px; border-radius: var(--r); margin-bottom: 3px; font-size: 13.5px; font-weight: 500; border-left: 3px solid transparent; transition: all .18s ease; }
    .sidebar a:hover { background: var(--s3); color: var(--text); border-left-color: var(--bhi); }
    .sidebar a.active { background: var(--glow); color: var(--accent); border-left-color: var(--accent); font-weight: 600; }
    .sidebar a[href="/logout/"] { color: var(--red) !important; }
    .sidebar a[href="/logout/"]:hover { background: var(--rbg) !important; border-left-color: var(--red) !important; }

    /* ── MAIN ── */
    .main { flex: 1; padding: 28px; min-width: 0; }
    .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 28px; gap: 16px; flex-wrap: wrap; }
    .topbar h2 { font-size: 24px; font-weight: 700; letter-spacing: -.5px; }
    .top-actions, .actions, .search-box, .recordatorios-actions { display: flex; gap: 10px; flex-wrap: wrap; }

    /* ── BUTTONS ── */
    .btn { padding: 9px 18px; border: none; border-radius: var(--r); cursor: pointer; font-family: 'Plus Jakarta Sans', sans-serif; font-size: 13.5px; font-weight: 600; background: linear-gradient(135deg,var(--accent),#0891b2); color: #040d1a; transition: all .18s; box-shadow: 0 2px 12px rgba(45,212,191,.2); text-decoration: none; display: inline-block; }
    .btn:hover { filter: brightness(1.1); box-shadow: 0 4px 20px rgba(45,212,191,.3); transform: translateY(-1px); }
    .btn.secondary { background: var(--s2); color: var(--text); border: 1px solid var(--bmd); box-shadow: none; }
    .btn.secondary:hover { background: var(--s3); border-color: var(--bhi); filter: none; transform: translateY(-1px); box-shadow: none; }
    .btn.danger { background: var(--red); color: #fff; box-shadow: 0 2px 10px rgba(251,113,133,.2); }
    .btn.danger:hover { filter: brightness(1.1); box-shadow: 0 4px 16px rgba(251,113,133,.3); }
    .btn.success { background: var(--green); color: #040d1a; box-shadow: 0 2px 10px rgba(52,211,153,.2); }
    .btn.success:hover { filter: brightness(1.1); }
    .btn.green { background: var(--green); color: #040d1a; box-shadow: 0 2px 10px rgba(52,211,153,.2); }
    .btn.green:hover { filter: brightness(1.1); }
    .btn.orange { background: var(--amber); color: #1a1000; box-shadow: 0 2px 10px rgba(251,191,36,.2); }
    .btn.orange:hover { filter: brightness(1.1); }
    .btn.gray { background: var(--s3); color: var(--text); border: 1px solid var(--bmd); box-shadow: none; }
    .btn.word { background: linear-gradient(135deg,#3b82f6,#1d4ed8); color: #fff; box-shadow: 0 2px 10px rgba(59,130,246,.2); }

    /* ── CARDS ── */
    .cards { display: grid; grid-template-columns: repeat(4,1fr); gap: 16px; margin-bottom: 28px; }
    .card { background: linear-gradient(145deg,var(--s2),var(--surface)); border: 1px solid var(--bmd); border-radius: var(--rl); padding: 20px; position: relative; overflow: hidden; }
    .card::after { content: ''; position: absolute; top: -16px; right: -16px; width: 64px; height: 64px; background: var(--glow); border-radius: 50%; }
    .card h3 { font-size: 10.5px; font-weight: 700; letter-spacing: .9px; text-transform: uppercase; color: var(--t2); margin-bottom: 10px; }
    .card p { font-size: 28px; font-weight: 700; color: var(--text); letter-spacing: -1px; }

    /* ── TABLE ── */
    .table-container { background: var(--surface); border: 1px solid var(--bmd); border-radius: var(--rl); overflow: hidden; }
    table { width: 100%; border-collapse: collapse; }
    thead { background: var(--s2); }
    th, td { padding: 13px 16px; text-align: left; border-bottom: 1px solid var(--border); font-size: 13.5px; }
    th { color: var(--accent); font-size: 10.5px; font-weight: 700; letter-spacing: .9px; text-transform: uppercase; }
    td { color: var(--text); }
    tbody tr { transition: background .12s; }
    tbody tr:hover { background: rgba(45,212,191,.03); }
    tbody tr:last-child td { border-bottom: none; }

    /* ── BADGES ── */
    .estado-activo { color: var(--green); font-weight: 600; font-size: 11.5px; background: var(--gbg); padding: 3px 9px; border-radius: 20px; display: inline-block; }
    .estado-inactivo { color: var(--red); font-weight: 600; font-size: 11.5px; background: var(--rbg); padding: 3px 9px; border-radius: 20px; display: inline-block; }
    .monto { color: var(--green); font-weight: 700; }
    .empty { color: var(--t2); font-size: 13px; padding: 10px 0; }

    /* ── MODAL ── */
    .modal-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,.75); backdrop-filter: blur(4px); display: none; align-items: center; justify-content: center; padding: 20px; z-index: 9999; }
    .modal { width: 100%; max-width: 640px; background: var(--surface); border: 1px solid var(--bmd); border-radius: var(--rl); padding: 28px; box-shadow: 0 20px 60px rgba(0,0,0,.6); max-height: 90vh; overflow-y: auto; }
    .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 22px; padding-bottom: 16px; border-bottom: 1px solid var(--border); }
    .modal-header h3 { font-size: 18px; font-weight: 700; color: var(--text); letter-spacing: -.3px; }
    .close-btn { background: var(--s2); color: var(--t2); border: 1px solid var(--bmd); width: 30px; height: 30px; border-radius: 8px; font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center; line-height: 1; transition: all .15s; }
    .close-btn:hover { background: var(--rbg); color: var(--red); border-color: var(--red); }

    /* ── FORMS ── */
    .form-grid { display: grid; grid-template-columns: repeat(2,1fr); gap: 14px; }
    .form-group { display: flex; flex-direction: column; gap: 6px; }
    .form-group.full { grid-column: 1 / -1; }
    .form-group label { color: var(--t2); font-size: 11px; font-weight: 700; letter-spacing: .6px; text-transform: uppercase; }
    .form-group input, .form-group select, .form-group textarea { padding: 10px 13px; border-radius: var(--r); border: 1px solid var(--bmd); background: var(--s2); color: var(--text); outline: none; width: 100%; font-family: 'Plus Jakarta Sans', sans-serif; font-size: 14px; transition: border-color .15s, box-shadow .15s; }
    .form-group input:focus, .form-group select:focus, .form-group textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--glow); }
    .form-group input[readonly] { opacity: .55; cursor: not-allowed; }
    .form-group textarea { resize: vertical; min-height: 90px; }
    .modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 22px; padding-top: 16px; border-top: 1px solid var(--border); flex-wrap: wrap; }
    .mensaje { margin-top: 10px; font-size: 13px; color: var(--a2); }

    /* ── SEARCH ── */
    .search-box input, .search { padding: 10px 14px; border-radius: var(--r); border: 1px solid var(--bmd); background: var(--s2); color: var(--text); outline: none; font-family: 'Plus Jakarta Sans', sans-serif; font-size: 14px; transition: border-color .15s, box-shadow .15s; }
    .search-box input:focus, .search:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--glow); }
    .search-box input { min-width: 260px; }
    .search { width: 100%; margin-bottom: 14px; }

    /* ── MISC INPUTS ── */
    input[type="color"] { height: 42px; padding: 4px; cursor: pointer; background: var(--s2); border: 1px solid var(--bmd); border-radius: var(--r); }
    input[type="date"], input[type="time"], select, textarea { color-scheme: dark; }
    input[type="date"]::-webkit-calendar-picker-indicator { filter: invert(.6) sepia(1) saturate(3) hue-rotate(150deg); cursor: pointer; }

    /* ── PANEL ── */
    .panel { background: var(--surface); border: 1px solid var(--bmd); border-radius: var(--rl); padding: 22px; }
    .panel h3 { color: var(--a2); font-size: 14px; font-weight: 700; margin-bottom: 16px; letter-spacing: -.2px; }

    /* ── DASHBOARD SPECIFICS ── */
    .badge { display: inline-block; padding: 4px 10px; border-radius: 999px; font-size: 12px; font-weight: 700; }
    .badge.correo { background: rgba(59,130,246,.2); color: #93c5fd; }
    .badge.whatsapp { background: rgba(52,211,153,.15); color: var(--green); }
    .tabla-wrap { overflow-x: auto; }
    .recordatorios-header { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }

    /* ── RESPONSIVE ── */
    @media (max-width: 1100px) { .cards { grid-template-columns: repeat(2,1fr); } }
    @media (max-width: 900px) {
      .layout { flex-direction: column; }
      .sidebar { width: 100%; border-right: none; border-bottom: 1px solid var(--bmd); }
      .cards { grid-template-columns: 1fr; }
      .table-container { overflow-x: auto; }
      table { min-width: 600px; }
      .form-grid { grid-template-columns: 1fr; }
      .search-box input { min-width: 100%; }
      .panel { overflow-x: auto; }
    }

    .modal { max-width: 720px !important; }
    .cards { grid-template-columns: repeat(3,1fr); }
  </style>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>
  <div class="layout">
        <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark">✚</div>
        <span class="brand-name">Clínica DS</span>
      </div>
      <a href="/dashboard/">Dashboard</a>
      <a href="/pacientes/">Pacientes</a>
      <a href="/citas/">Citas</a>
      <a href="/pagos/" class="active">Pagos</a>
      <a href="/notas/">Notas clínicas</a>
      <a href="/doctores/">Doctores</a>
      <a href="/usuarios/">Usuarios</a>
      <a href="/configuracion/">Configuración</a>
      <a href="/logout/" style="margin-top:30px;">Cerrar sesión</a>
    </aside>

    <main class="main">
      <div class="topbar">
        <h2>Pagos</h2>

        <div class="actions">
          <button class="btn secondary" onclick="cargarPagos()">Actualizar</button>
          <button class="btn" onclick="abrirModalPago()">Nuevo pago</button>
        </div>
      </div>

      <section class="cards">
        <div class="card">
          <h3>Total pagos</h3>
          <p id="totalPagos">0</p>
        </div>

        <div class="card">
          <h3>Total ingresado</h3>
          <p id="totalIngresado">Q0.00</p>
        </div>

        <div class="card">
          <h3>Último pago</h3>
          <p id="ultimoPago">Q0.00</p>
        </div>
      </section>

      <section class="table-container">
        <table>
          <thead>
            <tr>
              <th>ID</th>
              <th>Paciente</th>
              <th>Cita</th>
              <th>Tipo</th>
              <th>Monto</th>
              <th>Fecha</th>
              <th>Referencia</th>
              <th>Observaciones</th>
            </tr>
          </thead>

          <tbody id="tablaPagos"></tbody>
        </table>
      </section>
    </main>
  </div>

  <div class="modal-backdrop" id="modalPago">
    <div class="modal">
      <div class="modal-header">
        <h3>Nuevo pago</h3>
        <button class="close-btn" onclick="cerrarModalPago()">×</button>
      </div>

      <div class="form-grid">
        <div class="form-group">
          <label for="id_paciente">Paciente</label>
          <select id="id_paciente"></select>
        </div>

        <div class="form-group">
          <label for="id_cita">Cita relacionada</label>
          <select id="id_cita"></select>
        </div>

        <div class="form-group">
          <label for="id_tipo_pago">Tipo de pago</label>
          <select id="id_tipo_pago"></select>
        </div>

        <div class="form-group">
          <label for="monto">Monto</label>
          <input type="number" id="monto" step="0.01" min="0">
        </div>

        <div class="form-group full">
          <label for="referencia_pago">Referencia</label>
          <input type="text" id="referencia_pago">
        </div>

        <div class="form-group full">
          <label for="observaciones">Observaciones</label>
          <textarea id="observaciones"></textarea>
        </div>
      </div>

      <div class="modal-actions">
        <button class="btn secondary" onclick="cerrarModalPago()">Cancelar</button>
        <button class="btn" onclick="guardarPago()">Guardar pago</button>
      </div>

      <div class="mensaje" id="mensajePago"></div>
    </div>
  </div>

  <script>
    let pagosData = [];

    async function cargarPagos() {
      const res = await fetch('/api/pagos/');
      const data = await res.json();

      pagosData = data;
      renderPagos(data);
      actualizarResumen(data);
    }

    function renderPagos(data) {
      const tbody = document.getElementById('tablaPagos');
      tbody.innerHTML = '';

      data.forEach(p => {
        tbody.innerHTML += `
          <tr>
            <td>${p.id_pago}</td>
            <td>${p.paciente}</td>
            <td>${p.id_cita || 'Sin cita'}</td>
            <td>${p.tipo_pago}</td>
            <td class="monto">Q${Number(p.monto).toFixed(2)}</td>
            <td>${p.fecha_pago}</td>
            <td>${p.referencia_pago}</td>
            <td>${p.observaciones}</td>
          </tr>
        `;
      });
    }

    function actualizarResumen(data) {
      const totalPagos = data.length;
      const totalIngresado = data.reduce((sum, p) => sum + Number(p.monto || 0), 0);
      const ultimoPago = data.length > 0 ? Number(data[0].monto || 0) : 0;

      document.getElementById('totalPagos').textContent = totalPagos;
      document.getElementById('totalIngresado').textContent = 'Q' + totalIngresado.toFixed(2);
      document.getElementById('ultimoPago').textContent = 'Q' + ultimoPago.toFixed(2);
    }

    async function cargarCatalogosPagos() {
      const res = await fetch('/api/pagos/catalogos/');
      const data = await res.json();

      const selectPaciente = document.getElementById('id_paciente');
      const selectCita = document.getElementById('id_cita');
      const selectTipo = document.getElementById('id_tipo_pago');

      selectPaciente.innerHTML = '<option value="">Seleccione</option>';
      data.pacientes.forEach(p => {
        selectPaciente.innerHTML += `
          <option value="${p.id_paciente}">
            ${p.nombres} ${p.apellidos}
          </option>
        `;
      });

      selectCita.innerHTML = '<option value="">Sin cita relacionada</option>';
      data.citas.forEach(c => {
        selectCita.innerHTML += `
          <option value="${c.id_cita}">
            ${c.texto}
          </option>
        `;
      });

      selectTipo.innerHTML = '<option value="">Seleccione</option>';
      data.tipos_pago.forEach(t => {
        selectTipo.innerHTML += `
          <option value="${t.id_tipo_pago}">
            ${t.nombre_tipo_pago}
          </option>
        `;
      });
    }

    function abrirModalPago() {
      document.getElementById('modalPago').style.display = 'flex';
      document.getElementById('mensajePago').textContent = '';
    }

    function cerrarModalPago() {
      document.getElementById('modalPago').style.display = 'none';
      limpiarFormularioPago();
    }

    function limpiarFormularioPago() {
      document.getElementById('id_paciente').value = '';
      document.getElementById('id_cita').value = '';
      document.getElementById('id_tipo_pago').value = '';
      document.getElementById('monto').value = '';
      document.getElementById('referencia_pago').value = '';
      document.getElementById('observaciones').value = '';
    }

    async function guardarPago() {
      const payload = {
        id_paciente: document.getElementById('id_paciente').value,
        id_cita: document.getElementById('id_cita').value,
        id_tipo_pago: document.getElementById('id_tipo_pago').value,
        monto: document.getElementById('monto').value,
        referencia_pago: document.getElementById('referencia_pago').value.trim(),
        observaciones: document.getElementById('observaciones').value.trim()
      };

      if (!payload.id_paciente || !payload.id_tipo_pago || !payload.monto) {
        document.getElementById('mensajePago').textContent = 'Completa paciente, tipo de pago y monto.';
        return;
      }

      const res = await fetch('/api/pagos/crear/', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json'
        },
        body: JSON.stringify(payload)
      });

      const data = await res.json();

      if (data.ok) {
        document.getElementById('mensajePago').textContent = 'Pago guardado correctamente.';
        await cargarPagos();

        setTimeout(() => {
          cerrarModalPago();
        }, 700);
      } else {
        document.getElementById('mensajePago').textContent = data.error || 'Ocurrió un error.';
      }
    }

    cargarPagos();
    cargarCatalogosPagos();
  </script>

  <script>
    /* ── Carga logo dinámico desde configuración ── */
    (async function loadSidebarLogo() {
      try {
        const res = await fetch('/api/configuracion/');
        if (!res.ok) return;
        const cfg = await res.json();
        const mark = document.querySelector('.brand-mark');
        if (!mark) return;
        if (cfg.logo_url && cfg.logo_url.trim()) {
          mark.innerHTML = '';
          mark.style.padding = '0';
          mark.style.overflow = 'hidden';
          const img = document.createElement('img');
          img.src = cfg.logo_url.trim();
          img.alt = 'Logo';
          img.style.cssText = 'width:100%;height:100%;object-fit:cover;border-radius:10px;';
          img.onerror = function() {
            mark.style.padding = '';
            mark.style.overflow = '';
            mark.innerHTML = '✚';
          };
          mark.appendChild(img);
        }
        /* También actualiza nombre si está configurado */
        const brandName = document.querySelector('.brand-name');
        if (brandName && cfg.nombre_clinica && cfg.nombre_clinica.trim()) {
          brandName.textContent = cfg.nombre_clinica.trim();
        }
      } catch (e) { /* silencioso — muestra ✚ por defecto */ }
    })();
  </script>
</body>
</html>
